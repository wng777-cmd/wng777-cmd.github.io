name: Stabilize Full QA

on:
  push:
    branches: [stabilize-20260822]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'scripts/**'
      - '.github/workflows/stabilize-full-qa.yml'

permissions:
  contents: write

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Prepare QA probe
        run: |
          cat > stabilize-qa.js <<'EOF'
          (function(){
            const sleep=ms=>new Promise(r=>setTimeout(r,ms));
            const failures=[]; const checks=[];
            const ck=(ok,label)=>{checks.push({ok:!!ok,label}); if(!ok)failures.push(label)};
            const overflow=el=>el?Math.max(0,el.scrollWidth-el.clientWidth):999;
            async function waitReady(){for(let i=0;i<120;i++){if(typeof openModel==='function'&&typeof openVolvoInteriorGuide==='function'&&document.documentElement.getAttribute('data-interior-stable'))return;await sleep(100)}}
            async function testModels(){
              const keys=['XC40','XC60','XC90','EX30','EX30CC','EX90','ES90','S90','V60CC'];
              for(const k of keys){try{openModel(k);await sleep(120);const box=document.querySelector('.modal.open .box');ck(!!box,'model '+k+' opens');ck(overflow(box)<=3,'model '+k+' modal fits');if(typeof closeM==='function')closeM();await sleep(50)}catch(e){ck(false,'model '+k+' exception '+e)}}
              return keys.length;
            }
            async function testTools(){
              for(const [name,fn] of [['all trims','openAllTrims'],['compare','openCompare'],['tech','openTech'],['accessories','openAccessories']]){try{const f=window[fn];ck(typeof f==='function',name+' function exists');if(typeof f==='function'){f();await sleep(120);const box=document.querySelector('.modal.open .box');ck(!!box,name+' opens');ck(overflow(box)<=3,name+' modal fits');if(typeof closeM==='function')closeM();await sleep(50)}}catch(e){ck(false,name+' exception '+e)}}
              const darkModels=['XC40','XC60','XC90','S90'];
              if(typeof openDarkGuide==='function'){for(const k of darkModels){try{openDarkGuide(k);await sleep(120);const box=document.querySelector('.modal.open .box');ck(!!box,'dark '+k+' opens');ck(overflow(box)<=3,'dark '+k+' fits');if(typeof closeM==='function')closeM();await sleep(50)}catch(e){ck(false,'dark '+k+' exception '+e)}}}else ck(false,'dark guide function exists');
            }
            async function testCategories(){
              const cards=[...document.querySelectorAll('.category-card[data-filter]')];ck(cards.length>=3,'category buttons present');for(const b of cards){try{b.click();await sleep(60);const visible=[...document.querySelectorAll('#modelGrid .model')].filter(x=>getComputedStyle(x).display!=='none');ck(visible.length>0,'category '+b.dataset.filter+' shows models')}catch(e){ck(false,'category '+b.dataset.filter+' exception '+e)}}
            }
            async function testInterior(){
              const keys=['XC90','XC60','S90','XC40','V60CC','EX30','EX30CC','EX90','ES90'];let combos=0;
              for(const k of keys){try{openVolvoInteriorGuide(k);await sleep(150);const box=document.querySelector('#colors .vci-interior');ck(!!box,'interior '+k+' opens');ck(overflow(box)<=3,'interior '+k+' fits');const groups=[...box.querySelectorAll('.vci-group-btn')];ck(groups.length>0,'interior '+k+' groups present');for(let gi=0;gi<groups.length;gi++){groups[gi].click();await sleep(80);const seats=[...box.querySelectorAll('.vci-seat-btn')];ck(seats.length>0,'interior '+k+' group '+gi+' seats present');for(let si=0;si<seats.length;si++){seats[si].click();await sleep(110);combos++;const state=typeof getVolvoInteriorState==='function'?getVolvoInteriorState():null;const selected=box.querySelector('.vci-selected-head b')?.textContent.trim();const main=box.querySelector('.vci-main-canvas');const detail=box.querySelector('.vci-detail-canvas');ck(!!state&&selected===state.code,'interior '+k+' '+gi+'/'+si+' code sync');ck(main?.dataset.renderOk==='1'&&detail?.dataset.renderOk==='1','interior '+k+' '+gi+'/'+si+' image renders');ck(main?.width>=1000&&main?.height>=600,'interior '+k+' '+gi+'/'+si+' render resolution');if(k==='S90')ck(!box.textContent.includes('Dawn')&&!box.textContent.includes('던'),'S90 has no Dawn');}}
              }catch(e){ck(false,'interior '+k+' exception '+e)}}
              ck(combos===46,'all 46 interior combinations tested');return combos;
            }
            async function run(){
              window.addEventListener('error',e=>failures.push('runtime error '+e.message));window.addEventListener('unhandledrejection',e=>failures.push('promise rejection '+String(e.reason)));
              await waitReady();ck(typeof openModel==='function','core model function ready');ck(typeof openVolvoInteriorGuide==='function','stable interior function ready');ck(document.documentElement.getAttribute('data-interior-stable')==='20260822-1','stable interior marker ready');
              ck(Math.max(0,document.documentElement.scrollWidth-innerWidth)<=3,'page has no horizontal overflow');ck(document.querySelectorAll('a[href^="tel:"]').length>=3,'phone links present');ck(document.querySelectorAll('a[href*="kakao.com"]').length>=3,'kakao links present');
              await testCategories();const modelCount=await testModels();await testTools();const combos=await testInterior();
              if(innerWidth<=500){const h=document.querySelector('.hamb');if(h){h.click();await sleep(80);const menu=document.querySelector('.mobile-quick-nav');ck(!!menu&&menu.classList.contains('open'),'mobile menu opens')}}
              const result={width:innerWidth,height:innerHeight,modelCount,combos,checks,failures};const p=document.createElement('pre');p.id='stabilize-qa-result';p.textContent=JSON.stringify(result);document.body.appendChild(p);
            }
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run,{once:true});else run();
          })();
          EOF
          python3 - <<'PY'
          p='index.html'
          s=open(p,encoding='utf-8').read()
          s=s.replace('</body>','<script src="stabilize-qa.js"></script>\n</body>')
          open(p,'w',encoding='utf-8').write(s)
          PY
      - name: Start local site
        run: |
          python3 -m http.server 8000 >/tmp/stabilize-server.log 2>&1 &
          sleep 2
      - name: Run PC and mobile QA
        run: |
          mkdir -p /tmp/stabilize-qa
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER"
          for spec in desktop:1440:1000 mobile:390:844; do
            IFS=: read NAME W H <<< "$spec"
            "$BROWSER" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size="$W,$H" --virtual-time-budget=35000 --screenshot="/tmp/stabilize-qa/${NAME}.png" --dump-dom "http://127.0.0.1:8000/?qa=stabilize" > "/tmp/stabilize-qa/${NAME}.html" 2> "/tmp/stabilize-qa/${NAME}.log" || true
          done
          python3 - <<'PY'
          import json,re,html,os
          all_fail=[]; screens={}
          for name in ['desktop','mobile']:
              txt=open(f'/tmp/stabilize-qa/{name}.html',encoding='utf-8',errors='ignore').read()
              m=re.search(r'<pre id="stabilize-qa-result">(.*?)</pre>',txt,re.S)
              if not m:
                  all_fail.append(name+' missing QA result'); continue
              d=json.loads(html.unescape(m.group(1))); screens[name]=d
              all_fail += [name+': '+x for x in d.get('failures',[])]
          report={'screens':screens,'failures':all_fail}
          open('/tmp/stabilize-qa/report.json','w',encoding='utf-8').write(json.dumps(report,ensure_ascii=False,indent=2))
          print(json.dumps(report,ensure_ascii=False,indent=2))
          raise SystemExit(1 if all_fail else 0)
          PY
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stabilize-full-qa
          path: /tmp/stabilize-qa
      - name: Publish QA report
        if: always()
        run: |
          mkdir -p qa
          if [ -f /tmp/stabilize-qa/report.json ]; then cp /tmp/stabilize-qa/report.json qa/stabilize-full-qa-report.json; else printf '{"failures":["QA report missing"]}\n' > qa/stabilize-full-qa-report.json; fi
          git checkout -- index.html 2>/dev/null || true
          rm -f stabilize-qa.js
          git config user.name "stabilize-full-qa"
          git config user.email "actions@users.noreply.github.com"
          git add qa/stabilize-full-qa-report.json
          git commit -m "Record stabilization QA [skip ci]" || exit 0
          git pull --rebase origin stabilize-20260822
          git push origin HEAD:stabilize-20260822
