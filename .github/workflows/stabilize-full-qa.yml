name: Stabilize Full QA

on:
  push:
    branches: [stabilize-20260822]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'scripts/**'
      - '.github/workflows/stabilize-full-qa.yml'

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Inject probe
        run: |
          mkdir -p /tmp/stabilize-qa
          cat > qa-probe.js <<'EOF'
          (function(){
            const sleep=ms=>new Promise(r=>setTimeout(r,ms)),fail=[],checks=[];const ck=(v,l)=>{checks.push({ok:!!v,label:l});if(!v)fail.push(l)};const ov=e=>e?Math.max(0,e.scrollWidth-e.clientWidth):999;
            async function wait(){for(let i=0;i<120;i++){if(typeof openModel==='function'&&typeof openVolvoInteriorGuide==='function'&&typeof openDarkGuide==='function'&&document.documentElement.getAttribute('data-interior-stable'))return true;await sleep(100)}return false}
            async function run(){ck(await wait(),'all site functions ready');ck(document.documentElement.getAttribute('data-stable-loader')==='20260822-1','stable loader complete');ck(Math.max(0,document.documentElement.scrollWidth-innerWidth)<=3,'page fits');ck(document.querySelectorAll('a[href^="tel:"]').length>=3,'phone links');ck(document.querySelectorAll('a[href*="kakao.com"]').length>=3,'kakao links');
              const cats=[...document.querySelectorAll('.category-card[data-filter]')];ck(cats.length>=3,'categories present');for(const b of cats){b.click();await sleep(40);ck([...document.querySelectorAll('#modelGrid .model')].some(x=>getComputedStyle(x).display!=='none'),'category '+b.dataset.filter)}
              const models=['XC40','XC60','XC90','EX30','EX30CC','EX90','ES90','S90','V60CC'];for(const k of models){openModel(k);await sleep(90);let box=document.querySelector('.modal.open .box');ck(!!box,'model '+k+' opens');ck(ov(box)<=3,'model '+k+' fits');closeM();await sleep(30)}
              for(const [n,f] of [['all trims','openAllTrims'],['compare','openCompare'],['tech','openTech'],['accessories','openAccessories']]){ck(typeof window[f]==='function',n+' exists');window[f]();await sleep(90);let box=document.querySelector('.modal.open .box');ck(!!box,n+' opens');ck(ov(box)<=3,n+' fits');closeM();await sleep(30)}
              for(const k of ['XC40','XC60','XC90','S90']){openDarkGuide(k);await sleep(90);let box=document.querySelector('.modal.open .box');ck(!!box,'dark '+k+' opens');ck(ov(box)<=3,'dark '+k+' fits');closeM();await sleep(30)}
              let combos=0;for(const k of ['XC90','XC60','S90','XC40','V60CC','EX30','EX30CC','EX90','ES90']){openVolvoInteriorGuide(k);await sleep(120);const box=document.querySelector('#colors .vci-interior');ck(!!box,'interior '+k+' opens');ck(ov(box)<=3,'interior '+k+' fits');const gs=[...box.querySelectorAll('.vci-group-btn')];for(let gi=0;gi<gs.length;gi++){gs[gi].click();await sleep(60);const ss=[...box.querySelectorAll('.vci-seat-btn')];for(let si=0;si<ss.length;si++){ss[si].click();await sleep(90);combos++;const st=getVolvoInteriorState(),sel=box.querySelector('.vci-selected-head b')?.textContent.trim(),m=box.querySelector('.vci-main-canvas'),d=box.querySelector('.vci-detail-canvas');ck(sel===st.code,'interior '+k+' '+gi+'/'+si+' code');ck(m?.dataset.renderOk==='1'&&d?.dataset.renderOk==='1','interior '+k+' '+gi+'/'+si+' render');ck(m?.width>=1000&&m?.height>=600,'interior '+k+' '+gi+'/'+si+' resolution');if(k==='S90')ck(!box.textContent.includes('Dawn')&&!box.textContent.includes('던'),'S90 excludes Dawn')}}}
              ck(combos===46,'46 interior combinations');if(innerWidth<=500){document.querySelector('.hamb')?.click();await sleep(60);ck(document.querySelector('.mobile-quick-nav')?.classList.contains('open'),'mobile menu')}
              const p=document.createElement('pre');p.id='qa-result';p.textContent=JSON.stringify({width:innerWidth,height:innerHeight,combos,checks,failures:fail});document.body.appendChild(p)}
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run,{once:true});else run();
          })();
          EOF
          python3 - <<'PY'
          p='index.html';s=open(p,encoding='utf-8').read();s=s.replace('</body>','<script src="qa-probe.js"></script>\n</body>');open(p,'w',encoding='utf-8').write(s)
          PY
      - name: Serve and test
        run: |
          python3 -m http.server 8000 >/tmp/server.log 2>&1 & sleep 2
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"; test -n "$BROWSER"
          for spec in desktop:1440:1000 mobile:390:844; do IFS=: read N W H <<< "$spec"; "$BROWSER" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size="$W,$H" --virtual-time-budget=35000 --screenshot="/tmp/stabilize-qa/$N.png" --dump-dom "http://127.0.0.1:8000/?qa=1" > "/tmp/stabilize-qa/$N.html" 2> "/tmp/stabilize-qa/$N.log" || true; done
          python3 - <<'PY'
          import json,re,html
          failures=[];screens={}
          for n in ['desktop','mobile']:
            t=open('/tmp/stabilize-qa/'+n+'.html',encoding='utf-8',errors='ignore').read();m=re.search(r'<pre id="qa-result">(.*?)</pre>',t,re.S)
            if not m: failures.append(n+' missing result');continue
            d=json.loads(html.unescape(m.group(1)));screens[n]=d;failures += [n+': '+x for x in d['failures']]
          r={'screens':screens,'failures':failures};open('/tmp/stabilize-qa/report.json','w',encoding='utf-8').write(json.dumps(r,ensure_ascii=False,indent=2));print(json.dumps(r,ensure_ascii=False,indent=2));raise SystemExit(1 if failures else 0)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stabilize-full-qa
          path: /tmp/stabilize-qa
      - name: Publish report
        if: always()
        run: |
          mkdir -p qa; cp /tmp/stabilize-qa/report.json qa/stabilize-full-qa-report.json 2>/dev/null || printf '{"failures":["report missing"]}\n' > qa/stabilize-full-qa-report.json
          git checkout -- index.html 2>/dev/null || true; rm -f qa-probe.js
          git config user.name stabilize-full-qa; git config user.email actions@users.noreply.github.com
          git add qa/stabilize-full-qa-report.json; git commit -m 'Record stabilization QA [skip ci]' || exit 0; git pull --rebase origin stabilize-20260822; git push origin HEAD:stabilize-20260822
