name: Build stable interior atlas

on:
  push:
    branches: [stabilize-20260822]
    paths:
      - '.github/workflows/build-stable-interior-atlas.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build smooth high-resolution atlases from verified interior rows
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFilter
          root=Path('assets/interiors')
          out=root/'stable'; out.mkdir(parents=True,exist_ok=True)
          expected={'my26':25,'my27':21}
          for era in ('my26','my27'):
              files=sorted(root.glob(f'{era}-c*.webp'))
              if not files: raise SystemExit(f'No {era} atlas chunks')
              parts=[]
              for f in files:
                  im=Image.open(f).convert('RGB')
                  if im.width != 280: raise SystemExit(f'{f}: unexpected width {im.width}')
                  if im.height % 117: raise SystemExit(f'{f}: unexpected height {im.height}')
                  parts.append(im)
              rows=sum(im.height//117 for im in parts)
              if rows != expected[era]: raise SystemExit(f'{era}: expected {expected[era]} rows, got {rows}')
              low=Image.new('RGB',(280,rows*117),'white')
              y=0
              for im in parts:
                  low.paste(im,(0,y)); y+=im.height
              high=low.resize((1120,rows*468),Image.Resampling.LANCZOS)
              high=high.filter(ImageFilter.UnsharpMask(radius=1.1,percent=115,threshold=3))
              dest=out/f'{era}.webp'
              high.save(dest,'WEBP',quality=82,method=6)
              chk=Image.open(dest)
              if chk.size != (1120,rows*468): raise SystemExit(f'{dest}: bad output size {chk.size}')
              print(dest,chk.size,dest.stat().st_size)
          PY
      - name: Commit generated atlas assets
        run: |
          git config user.name "site-stabilizer"
          git config user.email "actions@users.noreply.github.com"
          git add assets/interiors/stable/my26.webp assets/interiors/stable/my27.webp
          git diff --cached --quiet && exit 0
          git commit -m "Build stable interior atlas assets [skip ci]"
          git pull --rebase origin stabilize-20260822
          git push origin stabilize-20260822
