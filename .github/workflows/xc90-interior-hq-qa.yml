name: XC90 Interior HQ QA

on:
  push:
    branches: [main]
    paths:
      - 'assets/interiors/xc90-*-hq.webp'
      - 'scripts/site-interior-xc90-hq-20260822.js'
      - 'scripts/site-pdf-refresh.js'
      - '.github/workflows/xc90-interior-hq-qa.yml'

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inject probe
        run: |
          cat > xc90-hq-probe.js <<'EOF'
          (function(){
            function done(){
              try{
                openVolvoInteriorGuide('XC90');
                setTimeout(function(){
                  var initial=document.querySelector('.ci-xc90-hq-img');
                  var first=initial&&initial.src;
                  var g=document.querySelector('#colors .ci-trim-btn[data-group="1"]'); if(g)g.click();
                  setTimeout(function(){
                    var b=document.querySelector('#colors .ci-seat-btn[data-variant="1"]'); if(b)b.click();
                    setTimeout(function(){
                      var img=document.querySelector('.ci-xc90-hq-img');
                      var out={width:innerWidth,overflow:Math.max(0,document.documentElement.scrollWidth-innerWidth),hqOn:!!document.querySelector('.ci-interior.xc90-hq-on'),code:img&&img.dataset.code,src:img&&img.getAttribute('src'),changed:!!(img&&first&&img.src!==first),loaded:!!(img&&img.complete&&img.naturalWidth>=1000),naturalWidth:img&&img.naturalWidth,displayWidth:img&&Math.round(img.getBoundingClientRect().width)};
                      var p=document.createElement('pre');p.id='xc90-hq-result';p.textContent=JSON.stringify(out);document.body.appendChild(p);
                    },500);
                  },150);
                },400);
              }catch(e){var p=document.createElement('pre');p.id='xc90-hq-result';p.textContent=JSON.stringify({exception:String(e)});document.body.appendChild(p)}
            }
            function wait(n){if(typeof openVolvoInteriorGuide==='function'&&document.querySelector('#colors .ci-interior'))done();else if(n<120)setTimeout(function(){wait(n+1)},50);else{var p=document.createElement('pre');p.id='xc90-hq-result';p.textContent=JSON.stringify({exception:'timeout'});document.body.appendChild(p)}}
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',function(){wait(0)},{once:true});else wait(0);
          })();
          EOF
          python3 - <<'PY'
          p='index.html';s=open(p,encoding='utf-8').read();s=s.replace('</body>','<script src="xc90-hq-probe.js"></script>\n</body>');open(p,'w',encoding='utf-8').write(s)
          PY
      - name: Run browser checks
        run: |
          mkdir -p /tmp/xc90-hq
          python3 -m http.server 8000 >/tmp/server.log 2>&1 & sleep 2
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          for spec in desktop:1440:1000 mobile:390:844; do
            IFS=: read NAME W H <<< "$spec"
            "$BROWSER" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size="$W,$H" --virtual-time-budget=9000 --screenshot="/tmp/xc90-hq/$NAME.png" --dump-dom http://127.0.0.1:8000/ > "/tmp/xc90-hq/$NAME.html" 2>/dev/null || true
          done
          python3 - <<'PY'
          import re,json,html
          fail=[];screens={}
          for name in ('desktop','mobile'):
            t=open('/tmp/xc90-hq/'+name+'.html',encoding='utf-8',errors='ignore').read();m=re.search(r'<pre id="xc90-hq-result">(.*?)</pre>',t,re.S)
            if not m: fail.append(name+' missing result');continue
            d=json.loads(html.unescape(m.group(1)));screens[name]=d
            if d.get('exception'):fail.append(name+' '+d['exception']);continue
            if not d.get('hqOn'):fail.append(name+' HQ viewer not active')
            if d.get('code')!='RC00':fail.append(name+' RC00 not selected')
            if not d.get('changed'):fail.append(name+' image did not change')
            if not d.get('loaded'):fail.append(name+' image is not >=1000px or failed load')
            if d.get('overflow',999)>3:fail.append(name+' horizontal overflow')
            if name=='mobile' and d.get('displayWidth',0)<330:fail.append(name+' image too narrow')
          open('/tmp/xc90-hq/report.json','w').write(json.dumps({'screens':screens,'failures':fail},ensure_ascii=False,indent=2))
          print(open('/tmp/xc90-hq/report.json').read());raise SystemExit(1 if fail else 0)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xc90-interior-hq-qa
          path: /tmp/xc90-hq
      - name: Publish report
        if: always()
        run: |
          mkdir -p qa; cp /tmp/xc90-hq/report.json qa/xc90-interior-hq-qa-report.json || true
          git checkout -- index.html; rm -f xc90-hq-probe.js
          git config user.name xc90-hq-qa; git config user.email actions@users.noreply.github.com
          git add qa/xc90-interior-hq-qa-report.json; git commit -m 'Record XC90 HQ interior QA [skip ci]' || exit 0; git pull --rebase origin main; git push