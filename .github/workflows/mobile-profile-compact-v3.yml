name: Compact mobile profile v3
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-profile-compact-v3.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply mobile-only compact profile
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='''<style id="mobile-profile-v3">
          @media (max-width:700px){
            .hero{min-height:auto!important;overflow:visible!important;padding-bottom:0!important}
            .copy{padding:52px 22px 28px!important}
            .profile{position:relative!important;right:auto!important;bottom:auto!important;width:calc(100% - 28px)!important;margin:0 14px 24px!important;padding:12px!important;border-radius:16px!important;grid-template-columns:58px 1fr!important;box-shadow:0 10px 28px #00000020!important}
            .profile img{width:58px!important;height:74px!important;border-radius:10px!important}
            .pb{padding-left:10px!important}
            .pb small{font-size:6px!important}
            .pb h3{font-size:19px!important;margin:3px 0 5px!important}
            .pb p{font-size:7.5px!important;line-height:1.4!important}
            .pb p br{display:none!important}
            .profile-actions{margin-top:9px!important;padding-top:8px!important;grid-template-columns:1fr 1fr!important;gap:6px!important}
            .profile-info{grid-column:1/-1!important;display:flex!important;flex-direction:row!important;align-items:center!important;justify-content:space-between!important;gap:8px!important;padding:0 0 7px!important;border-right:0!important;border-bottom:1px solid #e1e5e7!important}
            .profile-location{font-size:7px!important;white-space:nowrap!important}
            .profile-phone{font-size:9px!important;white-space:nowrap!important}
            .profile-btn{min-height:32px!important;border-radius:9px!important;font-size:8px!important;padding:0 4px!important}
            .floating-contact{height:48px!important}
          }
          </style>'''
          if 'id="mobile-profile-v3"' not in s:
              s=s.replace('</head>',css+'\n</head>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Make mobile consultant card compact [skip ci]"
          git push
