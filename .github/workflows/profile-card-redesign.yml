name: Profile card redesign

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/profile-card-redesign.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Redesign consultant profile card
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_css = ".hero{min-height:650px;position:relative;color:#fff;display:grid;grid-template-columns:minmax(0,1fr) 370px;overflow:hidden;"
          new_css = ".hero{min-height:650px;position:relative;color:#fff;display:grid;grid-template-columns:minmax(0,1fr) 560px;overflow:hidden;"
          s = s.replace(old_css, new_css)

          old_profile = ".profile{position:relative;z-index:3;width:340px;align-self:end;margin:0 2.8vw 42px 0;border-radius:22px;background:#fffffff7;display:grid;grid-template-columns:92px 1fr;align-items:center;padding:15px;color:#111;box-shadow:0 16px 42px #00000020}.profile img{width:92px;height:116px;object-fit:cover;border-radius:14px}.pb{padding-left:15px}.pb small{font-size:8px;color:#66717a}.pb h3{font-size:23px;margin:5px 0}.pb p{font-size:10px;line-height:1.45;color:#68747b;margin:0}.profile-actions{grid-column:1/-1;margin-top:13px;padding-top:12px;border-top:1px solid #e4e8ea}.profile-phone{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:800;margin-bottom:9px;color:#1b252c}.profile-buttons{display:grid;grid-template-columns:1fr 1fr;gap:7px}.profile-btn{display:flex;align-items:center;justify-content:center;min-height:38px;border-radius:11px;font-size:10px;font-weight:800;border:1px solid #d6dde0;background:#fff}.profile-btn.phone{background:var(--navy);color:#fff;border-color:var(--navy)}.profile-btn.kakao{background:#fee500;color:#111;border-color:#fee500}"
          new_profile = ".profile{position:relative;z-index:3;width:520px;align-self:end;margin:0 2.8vw 42px 0;border-radius:26px;background:#fffffff8;display:grid;grid-template-columns:128px 1fr;align-items:center;padding:22px 24px;color:#111;box-shadow:0 22px 60px #00000026}.profile img{width:128px;height:158px;object-fit:cover;border-radius:18px;background:#fff}.pb{padding-left:24px}.pb small{font-size:10px;letter-spacing:.04em;color:#66717a}.pb h3{font-size:34px;line-height:1;margin:10px 0 16px;letter-spacing:-.05em}.pb p{font-size:13px;line-height:1.65;color:#53616a;margin:0;max-width:300px}.profile-actions{grid-column:1/-1;margin-top:20px;padding-top:17px;border-top:1px solid #dfe4e6;display:grid;grid-template-columns:1.05fr 1fr 1.18fr;gap:9px;align-items:stretch}.profile-info{display:flex;flex-direction:column;justify-content:center;gap:8px;padding-right:12px;border-right:1px solid #e1e5e7;color:#1b252c}.profile-location{font-size:10px;color:#58666f}.profile-phone{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:900;margin:0;color:#111}.profile-buttons{display:contents}.profile-btn{display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:13px;font-size:11px;font-weight:900;border:1px solid #cbd2d6;background:#fff}.profile-btn.phone{background:#fff;color:#111;border-color:#9ea8ad}.profile-btn.kakao{background:#fee500;color:#111;border-color:#fee500}"
          if old_profile not in s:
              raise SystemExit('profile css target not found')
          s = s.replace(old_profile, new_profile)

          old_html = '<aside class="profile" id="contact"><img src="assets/img03.webp" alt="이민웅"><div class="pb"><small>VOLVO SALES CONSULTANT</small><h3>이민웅</h3><p>필요한 내용을 쉽고 정확하게 안내합니다.</p></div><div class="profile-actions"><div class="profile-phone">☎ 010-2650-3211</div><div class="profile-buttons"><a class="profile-btn phone" href="tel:01026503211">전화 상담</a><a class="profile-btn kakao" href="http://qr.kakao.com/talk/2LfLSm9DLJcfVv19vfXeS5R1AHQ-">카카오톡 상담</a></div></div></aside>'
          new_html = '<aside class="profile" id="contact"><img src="assets/img03.webp" alt="이민웅"><div class="pb"><small>VOLVO SALES CONSULTANT</small><h3>이민웅</h3><p>고객님의 라이프스타일에 가장 잘 맞는 볼보를<br>진심을 담아 제안드립니다.</p></div><div class="profile-actions"><div class="profile-info"><div class="profile-location">⌖ 볼보자동차 강남신사 전시장</div><div class="profile-phone">☎ 010-2650-3211</div></div><a class="profile-btn phone" href="tel:01026503211">☎&nbsp; 전화 상담하기</a><a class="profile-btn kakao" href="http://qr.kakao.com/talk/2LfLSm9DLJcfVv19vfXeS5R1AHQ-">TALK&nbsp; 카카오톡 상담하기</a></div></aside>'
          if old_html not in s:
              raise SystemExit('profile html target not found')
          s = s.replace(old_html, new_html)

          old_mobile = ".profile{display:none}.section{padding:36px 16px}"
          new_mobile = ".profile{display:grid;position:relative;right:auto;bottom:auto;width:calc(100% - 28px);margin:-12px 14px 22px;grid-template-columns:88px 1fr;padding:14px;border-radius:20px}.profile img{width:88px;height:112px;border-radius:13px}.pb{padding-left:13px}.pb small{font-size:7px}.pb h3{font-size:24px;margin:6px 0 9px}.pb p{font-size:9px;line-height:1.5}.profile-actions{margin-top:12px;padding-top:11px;grid-template-columns:1fr 1fr;gap:7px}.profile-info{grid-column:1/-1;border-right:0;border-bottom:1px solid #e1e5e7;padding:0 0 9px;gap:5px}.profile-location{font-size:9px}.profile-phone{font-size:12px}.profile-btn{min-height:40px;font-size:9px}.section{padding:36px 16px}"
          if old_mobile not in s:
              raise SystemExit('mobile css target not found')
          s = s.replace(old_mobile, new_mobile)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Redesign consultant profile card [skip ci]"
          git push
