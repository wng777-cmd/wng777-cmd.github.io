name: Interior Guide QA

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/interiors/**'
      - 'scripts/site-color-interior-guide-20260822.js'
      - 'scripts/site-interior-guide-layout-20260822.css'
      - 'scripts/site-pdf-refresh.js'
      - '.github/workflows/interior-guide-qa.yml'

permissions:
  contents: write

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Prepare interior QA probe
        run: |
          cat > interior-qa-probe.js <<'EOF'
          (function(){
            var started=0;
            function box(el){if(!el)return null;var r=el.getBoundingClientRect();return {x:Math.round(r.x),y:Math.round(r.y),w:Math.round(r.width),h:Math.round(r.height),bottom:Math.round(r.bottom)}}
            function result(){
              var ci=document.querySelector('#colors .ci-interior');
              var main=document.querySelector('#colors .ci-main-photo');
              var detail=document.querySelector('#colors .ci-detail-photo');
              var mainFrame=document.querySelector('#colors .ci-main-frame');
              var detailFrame=document.querySelector('#colors .ci-detail-frame');
              var visual=document.querySelector('#colors .ci-visual');
              var side=document.querySelector('#colors .ci-visual-side');
              var active=document.querySelector('#colors .ci-seat-btn.active b');
              var out={
                width:innerWidth,
                docOverflow:Math.max(0,document.documentElement.scrollWidth-innerWidth),
                interiorOpen:!!(ci&&ci.classList.contains('active')),
                selectedSeat:active?active.textContent.trim():null,
                photoCode:mainFrame?mainFrame.dataset.code:null,
                mainKey:main?main.dataset.photoKey:null,
                detailKey:detail?detail.dataset.photoKey:null,
                photoSrc:main?main.getAttribute('src'):null,
                mainLoaded:!!(main&&main.complete&&main.naturalWidth>0),
                detailLoaded:!!(detail&&detail.complete&&detail.naturalWidth>0),
                mainFrame:box(mainFrame),detailFrame:box(detailFrame),visual:box(visual),side:box(side),
                initialPhotoKey:window.__initialPhotoKey||null,
                initialPhotoSrc:window.__initialPhotoSrc||null
              };
              var p=document.createElement('pre');p.id='interior-qa-result';p.textContent=JSON.stringify(out);document.body.appendChild(p);
            }
            function run(){
              if(started++)return;
              try{
                if(typeof openVolvoInteriorGuide!=='function')throw new Error('openVolvoInteriorGuide unavailable');
                openVolvoInteriorGuide('XC90');
                setTimeout(function(){
                  var img=document.querySelector('#colors .ci-main-photo');
                  window.__initialPhotoKey=img&&img.dataset.photoKey;
                  window.__initialPhotoSrc=img&&img.getAttribute('src');
                  var group=document.querySelector('#colors .ci-trim-btn[data-group="1"]');
                  if(!group)throw new Error('XC90 ULTRA group unavailable');
                  group.click();
                  setTimeout(function(){
                    var seat=document.querySelector('#colors .ci-seat-btn[data-variant="1"]');
                    if(!seat)throw new Error('XC90 RC00 button unavailable');
                    seat.click();
                    setTimeout(result,550);
                  },180);
                },350);
              }catch(e){var p=document.createElement('pre');p.id='interior-qa-result';p.textContent=JSON.stringify({exception:String(e)});document.body.appendChild(p);}
            }
            function wait(n){
              if(typeof openVolvoInteriorGuide==='function')return run();
              if(n>120){var p=document.createElement('pre');p.id='interior-qa-result';p.textContent=JSON.stringify({exception:'interior guide timeout'});document.body.appendChild(p);return;}
              setTimeout(function(){wait(n+1)},50);
            }
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',function(){wait(0)},{once:true});else wait(0);
          })();
          EOF
          python3 - <<'PY'
          p='index.html';s=open(p,encoding='utf-8').read();s=s.replace('</body>','<script src="interior-qa-probe.js"></script>\n</body>');open(p,'w',encoding='utf-8').write(s)
          PY
      - name: Start site
        run: |
          python3 -m http.server 8000 >/tmp/interior-server.log 2>&1 &
          sleep 2
      - name: Test PC and mobile interaction and layout
        run: |
          mkdir -p /tmp/interior-qa
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$BROWSER" ]; then echo '{"failures":["No Chrome/Chromium"]}' > /tmp/interior-qa/report.json; exit 1; fi
          for spec in desktop:1440:1000 mobile:390:844; do
            IFS=: read NAME W H <<< "$spec"
            "$BROWSER" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size="$W,$H" --virtual-time-budget=9000 --screenshot="/tmp/interior-qa/${NAME}.png" --dump-dom "http://127.0.0.1:8000/?qa=interior-mobile-focus" > "/tmp/interior-qa/${NAME}.html" 2> "/tmp/interior-qa/${NAME}.log" || true
          done
          python3 - <<'PY'
          import json,re,html
          failures=[];screens={}
          for name in ('desktop','mobile'):
              text=open('/tmp/interior-qa/'+name+'.html',encoding='utf-8',errors='ignore').read()
              m=re.search(r'<pre id="interior-qa-result">(.*?)</pre>',text,re.S)
              if not m: failures.append(name+' missing QA result'); continue
              d=json.loads(html.unescape(m.group(1))); screens[name]=d
              if d.get('exception'): failures.append(name+' '+d['exception']); continue
              mf=d.get('mainFrame') or {}; df=d.get('detailFrame') or {}; vis=d.get('visual') or {}; side=d.get('side') or {}
              expected='XC90-1-RC00-7'
              checks={
                  'interior opens':d.get('interiorOpen') is True,
                  'RC00 button selected':d.get('selectedSeat')=='RC00',
                  'photo follows RC00':d.get('photoCode')=='RC00' and d.get('mainKey')==expected and d.get('detailKey')==expected,
                  'photo changes from initial':d.get('initialPhotoKey')!=d.get('mainKey') and d.get('initialPhotoSrc')!=d.get('photoSrc'),
                  'correct image chunk': 'assets/interiors/my26-c2.webp' in (d.get('photoSrc') or ''),
                  'images load':d.get('mainLoaded') is True and d.get('detailLoaded') is True,
                  'no horizontal overflow':d.get('docOverflow',999)<=3,
                  'main image has useful size':mf.get('w',0)>=300 and 160<=mf.get('h',0)<=330,
                  'detail is secondary':df.get('w',999)<mf.get('w',0),
              }
              if name=='mobile':
                  checks['mobile main uses visual width']=mf.get('w',0)>=vis.get('w',0)-20
                  checks['mobile detail sits below main']=side.get('y',0)>=mf.get('bottom',999)-2
                  checks['mobile detail remains compact']=70<=df.get('w',0)<=130 and 80<=df.get('h',0)<=160
              else:
                  checks['desktop side stays beside main']=side.get('y',999)<=mf.get('y',0)+5
                  checks['desktop visual stays compact']=vis.get('w',999)<=740
              for label,ok in checks.items():
                  if not ok: failures.append(name+' '+label)
          report={'screens':screens,'failures':failures}
          open('/tmp/interior-qa/report.json','w',encoding='utf-8').write(json.dumps(report,ensure_ascii=False,indent=2))
          print(json.dumps(report,ensure_ascii=False,indent=2))
          raise SystemExit(1 if failures else 0)
          PY
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interior-guide-qa
          path: /tmp/interior-qa
      - name: Publish interior QA report
        if: always()
        run: |
          mkdir -p qa
          if [ -f /tmp/interior-qa/report.json ]; then cp /tmp/interior-qa/report.json qa/interior-guide-qa-report.json; else echo '{"failures":["QA report missing"]}' > qa/interior-guide-qa-report.json; fi
          git checkout -- index.html 2>/dev/null || true
          rm -f interior-qa-probe.js
          git config user.name "interior-guide-qa"
          git config user.email "actions@users.noreply.github.com"
          git add qa/interior-guide-qa-report.json
          git commit -m "Record interior guide browser QA [skip ci]" || exit 0
          git pull --rebase origin main
          git push
