name: Build ES90 social preview
on:
  push:
    paths:
      - '.github/workflows/build-og-es90.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: pip install pillow
      - name: Build clean 1200x630 JPG preview
        run: |
          python - <<'PY'
          from PIL import Image, ImageEnhance
          src=Image.open('assets/img09.webp').convert('RGB')
          W,H=1200,630
          scale=max(W/src.width,H/src.height)
          im=src.resize((int(src.width*scale),int(src.height*scale)),Image.LANCZOS)
          left=(im.width-W)//2; top=(im.height-H)//2
          im=im.crop((left,top,left+W,top+H))
          im=ImageEnhance.Contrast(im).enhance(1.04)
          im=ImageEnhance.Sharpness(im).enhance(1.05)
          im.save('assets/og-es90-clean.jpg','JPEG',quality=93,optimize=True,progressive=True)
          PY
      - name: Patch Open Graph image
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          url='https://wng777-cmd.github.io/assets/og-es90-clean.jpg?v=5'
          s=re.sub(r'<meta property="og:image" content="[^"]*">',f'<meta property="og:image" content="{url}">',s)
          s=re.sub(r'<meta property="og:image:alt" content="[^"]*">','<meta property="og:image:alt" content="Volvo ES90">',s)
          s=re.sub(r'<meta name="twitter:image" content="[^"]*">',f'<meta name="twitter:image" content="{url}">',s)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit generated preview
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/og-es90-clean.jpg
          git commit -m 'Use clean ES90 photo for social preview [skip ci]' || exit 0
          git push
