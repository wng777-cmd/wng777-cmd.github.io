name: Build ES90 social preview
on:
  push:
    paths:
      - '.github/workflows/build-og-es90.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: pip install pillow
      - name: Build 1200x630 JPG preview
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont, ImageEnhance
          from pathlib import Path
          src=Image.open('assets/img09.webp').convert('RGB')
          W,H=1200,630
          scale=max(W/src.width,H/src.height)
          im=src.resize((int(src.width*scale),int(src.height*scale)),Image.LANCZOS)
          left=(im.width-W)//2; top=(im.height-H)//2
          im=im.crop((left,top,left+W,top+H))
          im=ImageEnhance.Contrast(im).enhance(1.05)
          overlay=Image.new('RGBA',(W,H),(0,0,0,0))
          d=ImageDraw.Draw(overlay)
          # dark premium gradient on left
          for x in range(720):
              a=int(210*(1-x/720)**0.55)
              d.line((x,0,x,H),fill=(5,17,27,a))
          im=Image.alpha_composite(im.convert('RGBA'),overlay)
          d=ImageDraw.Draw(im)
          def font(size,bold=False):
              paths=['/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf' if bold else '/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf']
              return ImageFont.truetype(paths[0],size)
          d.text((66,78),'NEW VOLVO',font=font(34,True),fill='white')
          d.text((64,125),'ES90',font=font(92,True),fill='white')
          d.text((69,238),'PURE ELECTRIC FLAGSHIP',font=font(26,True),fill=(220,231,237))
          d.line((68,292,505,292),fill=(255,255,255,130),width=2)
          d.text((68,322),'SCANDINAVIAN LUXURY',font=font(23,False),fill='white')
          d.text((68,365),'A NEW ERA OF ELECTRIC MOBILITY',font=font(19,False),fill=(223,230,235))
          d.text((68,525),'VOLVO PERSONAL GUIDE  |  LEE MINWOONG',font=font(18,True),fill='white')
          im.convert('RGB').save('assets/og-es90.jpg','JPEG',quality=92,optimize=True,progressive=True)
          PY
      - name: Patch Open Graph tags
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'<meta property="og:title" content="[^"]*">','<meta property="og:title" content="NEW VOLVO ES90 | 이민웅 Personal Guide">',s)
          s=re.sub(r'<meta property="og:description" content="[^"]*">','<meta property="og:description" content="차세대 순수 전기 플래그십 ES90과 볼보 전 라인업을 한눈에 확인하세요.">',s)
          s=re.sub(r'<meta property="og:image" content="[^"]*">','<meta property="og:image" content="https://wng777-cmd.github.io/assets/og-es90.jpg?v=4">',s)
          if 'og:image:type' not in s:
              marker='<meta property="og:image" content="https://wng777-cmd.github.io/assets/og-es90.jpg?v=4">'
              extra=marker+'<meta property="og:image:type" content="image/jpeg"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta property="og:image:alt" content="NEW VOLVO ES90 - 이민웅 Personal Guide">'
              s=s.replace(marker,extra)
          s=re.sub(r'<meta name="twitter:title" content="[^"]*">','<meta name="twitter:title" content="NEW VOLVO ES90 | 이민웅 Personal Guide">',s)
          s=re.sub(r'<meta name="twitter:description" content="[^"]*">','<meta name="twitter:description" content="차세대 순수 전기 플래그십 ES90과 볼보 전 라인업을 한눈에 확인하세요.">',s)
          s=re.sub(r'<meta name="twitter:image" content="[^"]*">','<meta name="twitter:image" content="https://wng777-cmd.github.io/assets/og-es90.jpg?v=4">',s)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Remove temporary files
        run: rm -f assets/og-es90-base64.txt
      - name: Commit generated preview
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/og-es90.jpg
          git rm -f assets/og-es90-base64.txt 2>/dev/null || true
          git commit -m 'Add ES90 JPG social preview [skip ci]' || exit 0
          git push
