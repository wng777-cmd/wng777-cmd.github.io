name: Interior PDF cache bust

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/interior-pdf-cache-bust.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Point index to fresh audited loader
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='scripts/site-pdf-refresh.js?v=20260823cards1'
          new='scripts/site-pdf-refresh.js?v=20260823pdf2'
          if new not in s:
              if old not in s:
                  raise SystemExit('expected loader marker not found')
              p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit cache update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Refresh PDF-audited interior loader [skip ci]"
          git pull --rebase origin main
          git push
