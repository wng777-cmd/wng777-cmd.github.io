name: Mobile cache bust

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-cache-bust.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Force fresh interior loader on PC and mobile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old=s
          s,n=re.subn(r'scripts/site-pdf-refresh\.js\?v=[^"\']+', 'scripts/site-pdf-refresh.js?v=20260823cards1', s, count=1)
          if n!=1:
              raise SystemExit('site-pdf-refresh loader reference not found')
          if s!=old:
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Bust interior loader cache [skip ci]"
          git pull --rebase origin main
          git push