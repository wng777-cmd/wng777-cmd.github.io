name: EX30CC Visual QA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ex30cc-visual-qa.yml'

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply cache-safe EX30CC position
        run: |
          python3 - <<'PY'
          p='index.html'
          s=open(p,encoding='utf-8').read()
          s=s.replace('scripts/site-final-polish-20260821.css?v=20260821final1','scripts/site-final-polish-20260821.css?v=20260821ex30cc2')
          old='.model[data-model="EX30CC"] img{object-position:center 66%}'
          first=s.find(old)
          if first>=0:
              s=s[:first]+'.model[data-model="EX30CC"] img{object-position:center 78%}'+s[first+len(old):]
          second=s.find(old)
          if second>=0:
              s=s[:second]+'.model[data-model="EX30CC"] img{object-position:center 80%}'+s[second+len(old):]
          open(p,'w',encoding='utf-8').write(s)
          PY
          git config user.name "ex30cc-visual-qa"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Force EX30CC image position on PC and mobile [skip ci]" || true
          git push || true
      - name: Inject EX30CC visual probe
        run: |
          cat > qa-ex30cc.js <<'EOF'
          (function(){
            function go(){
              try{
                if(typeof filterCategory==='function') filterCategory('electric');
                var card=document.querySelector('.model[data-model="EX30CC"]');
                if(card){
                  card.scrollIntoView({block:'center',inline:'center'});
                  var img=card.querySelector('img');
                  var mb=card.querySelector('.mb');
                  var chip=card.querySelector('.electric-range-chip');
                  var out={width:innerWidth,height:innerHeight,objectPosition:img?getComputedStyle(img).objectPosition:null,card:card.getBoundingClientRect().toJSON(),copy:mb?mb.getBoundingClientRect().toJSON():null,chip:chip?chip.getBoundingClientRect().toJSON():null,electricRange:document.documentElement.getAttribute('data-electric-range'),docOverflow:Math.max(0,document.documentElement.scrollWidth-innerWidth)};
                  var p=document.createElement('pre');p.id='qa-ex30cc-result';p.textContent=JSON.stringify(out);document.body.appendChild(p);
                }
              }catch(e){var p=document.createElement('pre');p.id='qa-ex30cc-result';p.textContent=JSON.stringify({exception:String(e)});document.body.appendChild(p);}
            }
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',function(){setTimeout(go,1600)},{once:true});else setTimeout(go,1600);
          })();
          EOF
          python3 - <<'PY'
          p='index.html';s=open(p,encoding='utf-8').read();s=s.replace('</body>','<script src="qa-ex30cc.js"></script>\n</body>');open(p,'w',encoding='utf-8').write(s)
          PY
      - name: Start local site
        run: |
          python3 -m http.server 8000 >/tmp/ex30cc-server.log 2>&1 &
          sleep 2
      - name: Capture desktop and mobile
        run: |
          mkdir -p /tmp/ex30cc-qa
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER"
          for spec in desktop:1440:1000 mobile:390:844; do
            IFS=: read NAME W H <<< "$spec"
            "$BROWSER" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size="$W,$H" --virtual-time-budget=8000 --screenshot="/tmp/ex30cc-qa/${NAME}.png" --dump-dom "http://127.0.0.1:8000/" > "/tmp/ex30cc-qa/${NAME}.html" 2> "/tmp/ex30cc-qa/${NAME}.log" || true
          done
          python3 - <<'PY'
          import re,html,json,glob,os
          report={}
          for p in glob.glob('/tmp/ex30cc-qa/*.html'):
              txt=open(p,encoding='utf-8',errors='ignore').read();m=re.search(r'<pre id="qa-ex30cc-result">(.*?)</pre>',txt,re.S)
              report[os.path.basename(p)[:-5]]=json.loads(html.unescape(m.group(1))) if m else {'missing':True}
          open('/tmp/ex30cc-qa/report.json','w',encoding='utf-8').write(json.dumps(report,ensure_ascii=False,indent=2))
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - name: Upload EX30CC screenshots
        uses: actions/upload-artifact@v4
        with:
          name: ex30cc-visual-qa
          path: /tmp/ex30cc-qa
      - name: Publish EX30CC metrics
        if: always()
        run: |
          git checkout -- index.html 2>/dev/null || true
          rm -f qa-ex30cc.js
          mkdir -p qa
          cp /tmp/ex30cc-qa/report.json qa/ex30cc-visual-report.json
          git add qa/ex30cc-visual-report.json
          git commit -m "Record EX30CC visual QA metrics [skip ci]" || exit 0
          git push
