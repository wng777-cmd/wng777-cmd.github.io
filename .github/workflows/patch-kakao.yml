name: Patch Kakao profile link
on:
  push:
    paths:
      - '.github/workflows/patch-kakao.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link Kakao profile button
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<button class="contact kakao" onclick="openKakao()">💬 카카오톡 상담 wng777</button>'
          new='<a class="contact kakao" href="http://qr.kakao.com/talk/2LfLSm9DLJcfVv19vfXeS5R1AHQ-" target="_blank" rel="noopener">💬 카카오톡 상담 wng777</a>'
          if old not in s:
              raise SystemExit('Kakao button pattern not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "ChatGPT Site Maintainer"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Link Kakao profile button" || exit 0
          git push
