name: Site Final QA

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'scripts/**'
      - '.github/workflows/site-final-qa.yml'

permissions:
  contents: write

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Prepare full customer-view QA probe
        run: |
          mkdir -p /tmp/site-qa
          cat > qa-probe.js <<'EOF'
          (function(){
            const sleep=ms=>new Promise(r=>setTimeout(r,ms));
            const failures=[]; const checks=[];
            const ck=(ok,label)=>{checks.push({ok:!!ok,label});if(!ok)failures.push(label)};
            const overflow=el=>el?Math.max(0,el.scrollWidth-el.clientWidth):999;
            async function ready(){for(let i=0;i<120;i++){if(typeof openModel==='function'&&typeof openVolvoInteriorGuide==='function'&&document.documentElement.getAttribute('data-interior-ui'))return true;await sleep(100)}return false}
            async function models(){const keys=['XC40','XC60','XC90','EX30','EX30CC','EX90','ES90','S90','V60CC'];for(const k of keys){try{openModel(k);await sleep(120);const box=document.querySelector('.modal.open .box');ck(!!box,'model '+k+' opens');ck(overflow(box)<=3,'model '+k+' modal fits');if(typeof closeM==='function')closeM();await sleep(40)}catch(e){ck(false,'model '+k+' exception '+e)}}return keys.length}
            async function categories(){const cards=[...document.querySelectorAll('.category-card[data-filter]')];ck(cards.length>=3,'category buttons present');for(const b of cards){b.click();await sleep(50);const visible=[...document.querySelectorAll('#modelGrid .model')].filter(x=>getComputedStyle(x).display!=='none');ck(visible.length>0,'category '+b.dataset.filter+' shows models')}}
            async function tools(){for(const [name,fn] of [['all trims','openAllTrims'],['compare','openCompare'],['tech','openTech'],['accessories','openAccessories']]){try{const f=window[fn];ck(typeof f==='function',name+' function exists');if(typeof f==='function'){f();await sleep(120);const box=document.querySelector('.modal.open .box');ck(!!box,name+' opens');ck(overflow(box)<=3,name+' fits');if(typeof closeM==='function')closeM();await sleep(40)}}catch(e){ck(false,name+' exception '+e)}}if(typeof openDarkGuide==='function'){for(const k of ['XC40','XC60','XC90','S90']){try{openDarkGuide(k);await sleep(100);const box=document.querySelector('.modal.open .box');ck(!!box,'dark '+k+' opens');ck(overflow(box)<=3,'dark '+k+' fits');if(typeof closeM==='function')closeM();await sleep(40)}catch(e){ck(false,'dark '+k+' exception '+e)}}}else ck(false,'dark guide function exists')}
            async function interiors(){const keys=['XC90','XC60','S90','XC40','V60CC','EX30','EX30CC','EX90','ES90'];let combos=0;for(const k of keys){try{openVolvoInteriorGuide(k);await sleep(80);const box=document.querySelector('#colors .vci-interior');ck(!!box,'interior '+k+' opens');ck(overflow(box)<=3,'interior '+k+' fits');ck(box?.dataset.renderMethod==='material-card','interior '+k+' material-card mode');ck(!box?.querySelector('canvas'),'interior '+k+' has no canvas');const gs=[...box.querySelectorAll('.vci-group-btn')];ck(gs.length>0,'interior '+k+' groups');for(let gi=0;gi<gs.length;gi++){gs[gi].click();await sleep(35);const seats=[...box.querySelectorAll('.vci-seat-btn')];ck(seats.length>0,'interior '+k+' group '+gi+' seats');for(let si=0;si<seats.length;si++){seats[si].click();await sleep(35);combos++;const st=getVolvoInteriorState();const selected=box.querySelector('.vci-selected-head b')?.textContent.trim();const board=box.querySelector('.vci-material-board'),seat=box.querySelector('.vci-seat-sample'),deco=box.querySelector('.vci-deco-sample');ck(selected===st.code,'interior '+k+' '+gi+'/'+si+' code sync');ck(!!board&&!!seat&&!!deco,'interior '+k+' '+gi+'/'+si+' material board renders');ck(getComputedStyle(seat).backgroundImage!=='none','interior '+k+' '+gi+'/'+si+' seat sample styled');ck(getComputedStyle(deco).backgroundImage!=='none','interior '+k+' '+gi+'/'+si+' deco sample styled');if(k==='S90')ck(!box.textContent.includes('Dawn')&&!box.textContent.includes('던'),'S90 excludes Dawn')}}}catch(e){ck(false,'interior '+k+' exception '+e)}}ck(combos===46,'all 46 interior combinations tested');return combos}
            async function run(){window.addEventListener('error',e=>failures.push('runtime error '+e.message));window.addEventListener('unhandledrejection',e=>failures.push('promise rejection '+String(e.reason)));ck(await ready(),'site functions ready');ck(document.documentElement.getAttribute('data-interior-ui')==='material-cards-20260823','material-card interior marker');ck(Math.max(0,document.documentElement.scrollWidth-innerWidth)<=3,'page no horizontal overflow');ck(document.querySelectorAll('a[href^="tel:"]').length>=3,'phone links');ck(document.querySelectorAll('a[href*="kakao.com"]').length>=3,'kakao links');await categories();const modelCount=await models();await tools();const combos=await interiors();if(innerWidth<=500){const h=document.querySelector('.hamb');if(h){h.click();await sleep(80);const menu=document.querySelector('.mobile-quick-nav');ck(!!menu&&menu.classList.contains('open'),'mobile menu opens')}}const out={width:innerWidth,height:innerHeight,modelCount,combos,checks,failures};const p=document.createElement('pre');p.id='qa-result';p.textContent=JSON.stringify(out);document.body.appendChild(p)}
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run,{once:true});else run();
          })();
          EOF
          python3 - <<'PY'
          p='index.html';s=open(p,encoding='utf-8').read();s=s.replace('</body>','<script src="qa-probe.js"></script>\n</body>');open(p,'w',encoding='utf-8').write(s)
          PY
      - name: Start local site
        run: |
          python3 -m http.server 8000 >/tmp/site-server.log 2>&1 &
          sleep 2
      - name: Render and inspect PC and mobile
        run: |
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER"
          for spec in desktop:1440:1000 mobile:390:844; do
            IFS=: read NAME W H <<< "$spec"
            "$BROWSER" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size="$W,$H" --virtual-time-budget=35000 --screenshot="/tmp/site-qa/${NAME}.png" --dump-dom "http://127.0.0.1:8000/?qa=final" > "/tmp/site-qa/${NAME}.html" 2> "/tmp/site-qa/${NAME}.log" || true
          done
          python3 - <<'PY'
          import json,re,html
          failures=[];screens={}
          for name in ['desktop','mobile']:
              txt=open(f'/tmp/site-qa/{name}.html',encoding='utf-8',errors='ignore').read();m=re.search(r'<pre id="qa-result">(.*?)</pre>',txt,re.S)
              if not m: failures.append(name+' missing QA result');continue
              d=json.loads(html.unescape(m.group(1)));screens[name]=d;failures += [name+': '+x for x in d.get('failures',[])]
          report={'screens':screens,'failures':failures};open('/tmp/site-qa/qa-report.json','w',encoding='utf-8').write(json.dumps(report,ensure_ascii=False,indent=2));print(json.dumps(report,ensure_ascii=False,indent=2));raise SystemExit(1 if failures else 0)
          PY
      - name: Upload QA screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-final-qa
          path: /tmp/site-qa
      - name: Publish QA report
        if: always()
        run: |
          mkdir -p qa
          if [ -f /tmp/site-qa/qa-report.json ]; then cp /tmp/site-qa/qa-report.json qa/site-final-qa-report.json; else printf '{"failures":["QA runner did not produce report"]}\n' > qa/site-final-qa-report.json; fi
          git checkout -- index.html 2>/dev/null || true; rm -f qa-probe.js
          git config user.name "site-final-qa"; git config user.email "actions@users.noreply.github.com"
          git add qa/site-final-qa-report.json; git commit -m "Record final browser QA [skip ci]" || exit 0; git pull --rebase origin main; git push