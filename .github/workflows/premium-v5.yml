name: Premium Volvo redesign v5
on:
  push:
    paths:
      - '.github/workflows/premium-v5.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply premium redesign
        run: python scripts/premium_patch_v5.py
      - name: Commit redesign
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html archive/index-before-premium-v5.html
          git commit -m 'Premium redesign v5 [skip ci]' || exit 0
          git push
