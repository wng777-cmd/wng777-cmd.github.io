name: Mobile hero full width v5

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-hero-fullwidth-v5.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make mobile hero image fill width
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'<style id="mobile-hero-v5">.*?</style>', '', s, flags=re.S)

          css = "<style id=\"mobile-hero-v5\">\n@media(max-width:700px){\n.hero{background-size:cover!important;background-position:center 72%!important;background-repeat:no-repeat!important;background-color:#07131d!important;}\n.hero:after{background:linear-gradient(180deg,rgba(7,19,29,.92) 0%,rgba(7,19,29,.74) 34%,rgba(7,19,29,.30) 62%,rgba(7,19,29,.60) 100%)!important;}\n}\n</style>"
          s = s.replace('</head>', css + '\n</head>', 1)
          s = s.replace('var v="20260815m4"', 'var v="20260815m5"')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Make mobile hero image full width [skip ci]"
          git push
