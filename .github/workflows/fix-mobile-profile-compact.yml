name: Fix mobile profile compact

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-mobile-profile-compact.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compact mobile consultant card
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old=".profile{display:grid;position:relative;right:auto;bottom:auto;width:calc(100% - 28px);margin:-12px 14px 22px;grid-template-columns:88px 1fr;padding:14px;border-radius:20px}.profile img{width:88px;height:112px;border-radius:13px}.pb{padding-left:13px}.pb small{font-size:7px}.pb h3{font-size:24px;margin:6px 0 9px}.pb p{font-size:9px;line-height:1.5}.profile-actions{margin-top:12px;padding-top:11px;grid-template-columns:1fr 1fr;gap:7px}.profile-info{grid-column:1/-1;border-right:0;border-bottom:1px solid #e1e5e7;padding:0 0 9px;gap:5px}.profile-location{font-size:9px}.profile-phone{font-size:12px}.profile-btn{min-height:40px;font-size:9px}"
          new=".profile{display:grid;position:relative;right:auto;bottom:auto;width:calc(100% - 32px);margin:-4px 16px 86px;grid-template-columns:72px 1fr;padding:12px;border-radius:18px}.profile img{width:72px;height:92px;border-radius:12px}.pb{padding-left:11px}.pb small{font-size:6px}.pb h3{font-size:21px;margin:5px 0 7px}.pb p{font-size:8px;line-height:1.45}.profile-actions{margin-top:10px;padding-top:9px;grid-template-columns:1fr 1fr;gap:6px}.profile-info{grid-column:1/-1;border-right:0;border-bottom:1px solid #e1e5e7;padding:0 0 7px;gap:4px}.profile-location{font-size:8px}.profile-phone{font-size:11px}.profile-btn{min-height:34px;font-size:8px;padding:0 6px}"
          if old not in s:
              raise SystemExit('mobile profile target not found')
          s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Compact mobile profile card [skip ci]"
          git push
